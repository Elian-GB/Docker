<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Visit Tracker</title>
    <!-- Fonts para diseño Luxury: Playfair Display para encabezados, Inter para cuerpo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Elementos decorativos de fondo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header glass-panel">
            <h1 class="logo">Luxe<span>Track</span></h1>
            <button id="logout-btn" class="btn btn-outline hidden">Cerrar Sesión</button>
        </header>

        <main class="main-content">
            <!-- SECCIÓN DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
            <section id="auth-section" class="card auth-card glass-panel fade-in">
                <div class="auth-tabs">
                    <button id="tab-login" class="tab active">Iniciar Sesión</button>
                    <button id="tab-register" class="tab">Registrarse</button>
                </div>

                <form id="auth-form" class="form">
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
                    </div>
                    <div class="input-group hidden" id="email-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo">
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                        <div class="strength-meter hidden" id="strength-meter">
                            <div class="strength-bar-container">
                                <div class="strength-bar" id="strength-bar"></div>
                            </div>
                            <span class="strength-text" id="strength-text"></span>
                        </div>
                    </div>
                    <div class="checkbox-group" id="remember-me-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Mantener sesión iniciada</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="auth-submit-btn">Entrar</button>
                </form>
            </section>

            <!-- SECCIÓN DEL USUARIO (DASHBOARD) -->
            <section id="user-section" class="hidden">
                <div class="card dashboard-card glass-panel fade-in">
                    <h2 class="greeting">Bienvenido de vuelta, <span id="user-name-display"></span>.</h2>
                    <p class="subtitle">Tu historial personal de visitas</p>
                    
                    <div class="stats-container">
                        <div class="stat-box glass-panel-inner">
                            <span class="stat-label">Visitas Personales</span>
                            <span class="stat-value" id="personal-visits-count">0</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN DEL ADMINISTRADOR -->
            <section id="admin-section" class="hidden">
                <div class="card admin-card glass-panel fade-in">
                    <h2>Panel de Administración</h2>
                    <p class="subtitle">Resumen global diario</p>
                    
                    <div class="admin-stats-list" id="admin-stats-list">
                        <div class="loading">Cargando estadísticas...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Contenedor para Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
